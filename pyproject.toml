[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky-tiled-mcp"
version = "0.1.0"
description = "MCP server for Tiled catalog — exposes Bluesky run data as MCP tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "fastmcp",
    "tiled[client]",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "tiled[server]",
    "openai",
    "httpx",
]

[project.scripts]
bluesky-tiled-mcp-server = "bluesky_tiled_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bluesky_tiled_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
